name: fastmedia-downloader

services:
  frontend:
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      NODE_ENV: production
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    restart: unless-stopped
    networks:
      - fastmedia-net

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8000}:8000"
    init: true
    environment:
      MEDIA_PROCESSOR_URL: http://media-processor:8001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX:-.*\.pages\.dev$}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DOWNLOADS_PER_MINUTE: ${DOWNLOADS_PER_MINUTE:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-65536}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-0}
      YTDLP_ALLOW_INSECURE_TLS: ${YTDLP_ALLOW_INSECURE_TLS:-0}
      FMD_COOKIES_FILE: ${FMD_COOKIES_FILE:-/app/secrets/cookies.txt}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      media-processor:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - fastmedia-net

  media-processor:
    build:
      context: .
      dockerfile: services/media-processor/Dockerfile
    ports:
      - "127.0.0.1:${MEDIA_PORT:-8001}:8001"
    init: true
    environment:
      TEMP_STORAGE_DIR: /app/temp_storage
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-30}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      MAX_JOB_MINUTES: ${MAX_JOB_MINUTES:-20}
      MAX_FILESIZE_MB: ${MAX_FILESIZE_MB:-2048}
      YTDLP_ALLOW_INSECURE_TLS: ${YTDLP_ALLOW_INSECURE_TLS:-0}
      FMD_COOKIES_FILE: ${FMD_COOKIES_FILE:-/app/secrets/cookies.txt}
    volumes:
      - media-storage:/app/temp_storage
      - ./secrets:/app/secrets:ro
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - fastmedia-net

volumes:
  media-storage:

networks:
  fastmedia-net:
    driver: bridge